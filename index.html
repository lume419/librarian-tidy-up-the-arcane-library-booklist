<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registre de la Bibliothèque Arcanique</title>
<meta name="description" content="Suivez votre progression pour ranger la Bibliothèque Arcanique de Tomodachi Life : cochez les séries de livres par étagère, par rayon et par étage.">
<link rel="canonical" href="https://lume419.github.io/librarian-tidy-up-the-arcane-library-booklist/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #130d09;
    --bg-vignette: #1c130c;
    --panel: #ece0c2;
    --panel-shadow: #cbb98d;
    --panel-header: #241a10;
    --panel-header-2: #2f2114;
    --ink: #2a2013;
    --ink-soft: #5a4b34;
    --gold: #c2a24d;
    --gold-bright: #e4c876;
    --verdigris: #4f7a72;
    --verdigris-bright: #6ea89d;
    --ember: #8a3324;
    --line: rgba(42,32,19,0.18);
    --radius: 3px;
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(194,162,77,0.08), transparent 45%),
      radial-gradient(ellipse at 100% 0%, rgba(79,122,114,0.08), transparent 50%),
      var(--bg);
    color: var(--panel);
    font-family: 'Spectral', serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header ---------- */
  header{
    position: sticky;
    top:0;
    z-index: 50;
    background: linear-gradient(180deg, #17100a 0%, #150f09 85%, rgba(21,15,9,0) 100%);
    border-bottom: 1px solid rgba(194,162,77,0.25);
    padding: 22px clamp(16px,4vw,48px) 16px;
    backdrop-filter: blur(6px);
  }

  .header-top{
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }

  h1{
    font-family: 'Cinzel Decorative', serif;
    font-weight: 700;
    font-size: clamp(20px, 2.6vw, 30px);
    letter-spacing: 0.02em;
    margin:0;
    color: var(--gold-bright);
    text-shadow: 0 0 18px rgba(194,162,77,0.25);
  }

  .subtitle{
    font-size: 13px;
    color: var(--verdigris-bright);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
  }

  .tally{
    text-align:right;
    font-family: 'JetBrains Mono', monospace;
  }
  .tally .num{
    font-size: clamp(22px,3vw,32px);
    color: var(--gold-bright);
    font-weight: 700;
  }
  .tally .num span{ color: rgba(228,200,118,0.45); font-weight:400; }
  .tally .label{ font-size: 11px; letter-spacing:0.12em; text-transform:uppercase; color: var(--verdigris-bright); }

  .progress-rail{
    margin-top: 14px;
    height: 6px;
    border-radius: 4px;
    background: rgba(255,255,255,0.06);
    overflow:hidden;
    border: 1px solid rgba(194,162,77,0.2);
  }
  .progress-fill{
    height:100%;
    width:0%;
    background: linear-gradient(90deg, var(--verdigris), var(--gold-bright));
    transition: width .4s ease;
  }

  .controls{
    display:flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items:center;
    margin-top: 16px;
  }

  .search-wrap{
    position: relative;
    flex: 1 1 240px;
  }
  .search-wrap input{
    width:100%;
    background: rgba(236,224,194,0.06);
    border: 1px solid rgba(194,162,77,0.3);
    border-radius: var(--radius);
    padding: 9px 32px 9px 32px;
    color: var(--panel);
    font-family: 'Spectral', serif;
    font-size: 14px;
  }
  .search-wrap input::placeholder{ color: rgba(236,224,194,0.4); }
  .search-wrap::before{
    content: "⚲";
    position:absolute;
    left: 10px; top:50%;
    transform: translateY(-50%) scaleX(-1);
    color: var(--gold);
    font-size: 14px;
  }
  .search-clear{
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: rgba(236,224,194,0.55);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: background .15s ease, color .15s ease;
  }
  .search-clear.visible{ display: flex; }
  .search-clear:hover{
    background: rgba(194,162,77,0.2);
    color: var(--gold-bright);
  }

  .toggle-btn, .floor-btn, .reset-btn{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: 1px solid rgba(194,162,77,0.35);
    background: rgba(194,162,77,0.06);
    color: var(--gold-bright);
    padding: 9px 14px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background .15s ease, transform .1s ease;
    white-space: nowrap;
  }
  .toggle-btn:hover, .floor-btn:hover, .reset-btn:hover{ background: rgba(194,162,77,0.16); }
  .toggle-btn:active, .floor-btn:active, .reset-btn:active{ transform: scale(0.97); }
  .toggle-btn.active{
    background: var(--gold);
    color: #1c1002;
    border-color: var(--gold);
  }

  .floor-group{ display:flex; gap:6px; }
  .floor-btn.active{
    background: var(--verdigris);
    color: #08130f;
    border-color: var(--verdigris);
  }

  .reset-btn{ border-color: rgba(138,51,36,0.5); color:#d99d90; }
  .reset-btn:hover{ background: rgba(138,51,36,0.18); }

  /* ---------- Layout wrapper (sidebars + main) ---------- */
  .layout{
    display:grid;
    grid-template-columns: 200px 1fr 200px;
    gap: clamp(16px, 2.4vw, 36px);
    max-width: 1760px;
    margin: 0 auto;
    padding: 22px clamp(16px,3vw,32px) 0;
    align-items: start;
  }

  .toc-side{
    position: sticky;
    top: calc(var(--header-h, 190px) + 16px);
    display:flex;
    flex-direction: column;
    gap: 8px;
    max-height: calc(100vh - var(--header-h, 190px) - 32px);
    overflow-y: auto;
    padding-bottom: 24px;
    scrollbar-width: thin;
  }
  .toc-side::-webkit-scrollbar{ width:6px; }
  .toc-side::-webkit-scrollbar-thumb{ background: rgba(194,162,77,0.3); border-radius:4px; }

  .toc-side h3{
    font-family: 'Cinzel Decorative', serif;
    font-size: 12.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--verdigris-bright);
    margin: 0 0 4px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(194,162,77,0.2);
  }

  .toc-item{
    font-family: 'Spectral', serif;
    font-size: 12.5px;
    line-height: 1.3;
    color: var(--panel);
    background: rgba(236,224,194,0.05);
    border: 1px solid rgba(194,162,77,0.22);
    border-radius: var(--radius);
    padding: 6px 10px;
    cursor: pointer;
    display:flex;
    flex-direction: row;
    align-items: center;
    gap: 8px;
    width: 100%;
    text-align:left;
    transition: background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .toc-item .toc-theme{ flex:1; min-width:0; }
  .toc-item:hover{
    background: rgba(194,162,77,0.14);
    border-color: rgba(194,162,77,0.5);
  }
  .toc-item:active{ transform: scale(0.97); }
  .toc-item .toc-code{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--gold-bright);
    opacity: 0.85;
    flex-shrink: 0;
  }

  @keyframes shelfFlash{
    0%   { box-shadow: 0 10px 30px rgba(194,162,77,0.0), inset 0 0 0 1px var(--panel-shadow); }
    25%  { box-shadow: 0 10px 40px rgba(194,162,77,0.55), inset 0 0 0 2px var(--gold-bright); }
    100% { box-shadow: 0 10px 30px rgba(0,0,0,0.35), inset 0 0 0 1px var(--panel-shadow); }
  }
  .shelf.flash{ animation: shelfFlash 1.1s ease; }

  /* Below this width there isn't room for two 200px rails; sidebars fold
     above the content as horizontal wrapping pill rows instead. */
  @media (max-width: 1180px){
    .layout{ display:block; padding: 18px clamp(16px,4vw,48px) 0; max-width:1400px; }
    .toc-side{ display:none; }
  }

  /* ---------- Layout ---------- */
  main{
    padding: 6px 0 80px;
  }

  .floor-heading{
    display:flex;
    align-items:center;
    gap: 14px;
    margin: 36px 0 18px;
  }
  .floor-heading:first-child{ margin-top: 6px; }
  .floor-heading h2{
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(16px,2vw,20px);
    color: var(--gold-bright);
    margin:0;
    letter-spacing: 0.03em;
  }
  .floor-heading .rule{
    flex:1;
    height:1px;
    background: linear-gradient(90deg, rgba(194,162,77,0.5), transparent);
  }

  .shelf-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 18px;
  }

  .shelf{
    background: var(--panel);
    border-radius: var(--radius);
    box-shadow: 0 10px 30px rgba(0,0,0,0.35), inset 0 0 0 1px var(--panel-shadow);
    overflow: hidden;
    display:flex;
    flex-direction: column;
    transition: opacity .25s ease, transform .25s ease;
    scroll-margin-top: calc(var(--header-h, 190px) + 14px);
  }
  .shelf.complete{
    box-shadow: 0 10px 30px rgba(79,122,114,0.25), inset 0 0 0 1px var(--verdigris);
  }
  .shelf.fully-hidden{ display:none; }

  .shelf-head{
    background: linear-gradient(180deg, var(--panel-header-2), var(--panel-header));
    padding: 12px 16px;
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 10px;
    cursor:pointer;
    user-select: none;
  }
  .shelf-head-left{ display:flex; align-items:baseline; gap:10px; min-width:0; }
  .shelf-code{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--gold-bright);
    background: rgba(194,162,77,0.15);
    border: 1px solid rgba(194,162,77,0.35);
    border-radius: 3px;
    padding: 2px 6px;
    flex-shrink:0;
  }
  .shelf.complete .shelf-code{
    color: #08130f;
    background: var(--verdigris-bright);
    border-color: var(--verdigris-bright);
  }
  .shelf-theme{
    font-size: 14.5px;
    font-weight: 600;
    color: var(--panel);
    overflow:hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .shelf-count{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: rgba(236,224,194,0.55);
    flex-shrink:0;
  }
  .shelf.complete .shelf-count{ color: var(--verdigris-bright); }

  .shelf-progress{
    height:3px;
    background: rgba(236,224,194,0.12);
  }
  .shelf-progress-fill{
    height:100%;
    background: linear-gradient(90deg, var(--verdigris), var(--gold-bright));
    width:0%;
    transition: width .3s ease;
  }

  .shelf-list{
    list-style:none;
    margin:0;
    padding: 6px 6px 10px;
    display:flex;
    flex-direction: column;
    flex:1;
  }

  .series-row{
    display:flex;
    align-items:flex-start;
    gap: 10px;
    padding: 8px 10px;
    border-radius: var(--radius);
    position: relative;
  }
  .series-row:hover{ background: rgba(42,32,19,0.05); }
  .series-row.hidden-row{ display:none; }

  .series-row input[type="checkbox"]{
    appearance: none;
    -webkit-appearance:none;
    width: 17px;
    height:17px;
    margin-top: 3px;
    border: 1.5px solid var(--ink-soft);
    border-radius: 2px;
    flex-shrink:0;
    cursor:pointer;
    position: relative;
    background: rgba(255,255,255,0.4);
    transition: background .15s ease, border-color .15s ease;
  }
  .series-row input[type="checkbox"]:checked{
    background: var(--verdigris);
    border-color: var(--verdigris);
  }
  .series-row input[type="checkbox"]:checked::after{
    content:"";
    position:absolute;
    left:5px; top:1px;
    width:4px; height:9px;
    border: solid #f4f0e2;
    border-width: 0 2px 2px 0;
    transform: rotate(40deg);
  }
  .series-row input[type="checkbox"]:focus-visible{
    outline: 2px solid var(--ember);
    outline-offset: 2px;
  }

  .series-text{ flex:1; min-width:0; }
  .series-title{
    font-size: 14px;
    line-height:1.35;
    color: var(--ink);
    cursor: pointer;
  }
  .series-row.done .series-title{
    color: var(--ink-soft);
    text-decoration: line-through;
    text-decoration-color: rgba(138,51,36,0.55);
    text-decoration-thickness: 1.5px;
  }

  .vol-badge{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--panel);
    background: var(--ink);
    padding: 2px 6px;
    border-radius: 2px;
    flex-shrink:0;
    margin-top:2px;
  }
  .series-row.done .vol-badge{
    background: var(--verdigris);
  }

  .stamp{
    position:absolute;
    right: 8px;
    top: 4px;
    font-family: 'Cinzel Decorative', serif;
    font-size: 9px;
    letter-spacing: 0.08em;
    color: var(--ember);
    border: 1px solid var(--ember);
    border-radius: 2px;
    padding: 1px 5px;
    transform: rotate(-6deg);
    opacity: 0.75;
    text-transform: uppercase;
    pointer-events:none;
  }

  .empty-state{
    text-align:center;
    padding: 60px 20px;
    color: rgba(236,224,194,0.5);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
  }

  footer{
    text-align:center;
    padding: 24px;
    color: rgba(236,224,194,0.3);
    font-size: 11.5px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.05em;
  }

  #backToTop{
    position: fixed;
    right: clamp(14px, 3vw, 28px);
    bottom: clamp(14px, 3vw, 28px);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(194,162,77,0.45);
    background: linear-gradient(180deg, var(--panel-header-2), var(--panel-header));
    color: var(--gold-bright);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(0,0,0,0.45);
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease, background .15s ease;
    z-index: 60;
  }
  #backToTop.visible{
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  #backToTop:hover{
    background: rgba(194,162,77,0.22);
  }
  #backToTop:active{ transform: scale(0.94); }

  @media (max-width: 560px){
    /* Unwrap the title block so h1 and .subtitle become direct grid items of
       .header-top: h1 spans the full row, then .subtitle and .tally sit as
       two side-by-side cells on the row below, vertically centered on each other. */
    .header-top{ display: grid; grid-template-columns: 1fr auto; column-gap: 16px; row-gap: 6px; align-items: center; }
    .header-top > div:first-child{ display: contents; }
    h1{ grid-column: 1 / -1; }
    .subtitle{ grid-column: 1; grid-row: 2; margin-top: 0; }
    .tally{ grid-column: 2; grid-row: 2; text-align: right; }
    .controls{ flex-direction: column; align-items: stretch; }
    .search-wrap{ flex: 0 0 auto; }
    .floor-group{ justify-content: space-between; }
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <h1>Registre de la Bibliothèque Arcanique</h1>
      <div class="subtitle">Librarian · Tidy Up the Arcane Library</div>
    </div>
    <div class="tally">
      <div class="num" id="tallyNum">0<span id="tallyTotal">/400</span></div>
      <div class="label">séries rangées</div>
    </div>
  </div>

  <div class="progress-rail"><div class="progress-fill" id="progressFill"></div></div>

  <div class="controls">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Rechercher une série, une étagère ou un rayon…" autocomplete="off">
      <button type="button" class="search-clear" id="searchClear" aria-label="Effacer la recherche" title="Effacer la recherche">✕</button>
    </div>
    <div class="floor-group">
      <button class="floor-btn active" data-floor="all">Tout</button>
      <button class="floor-btn" data-floor="1">Rez-de-chaussée</button>
      <button class="floor-btn" data-floor="2">Étage</button>
    </div>
    <button class="toggle-btn" id="hideToggle">Masquer les séries terminées</button>
    <button class="reset-btn" id="resetBtn">Réinitialiser</button>
  </div>
</header>

<div class="layout">
  <nav class="toc-side toc-left" id="tocLeftWrap" aria-label="Catégories du rez-de-chaussée">
    <h3>Rez-de-chaussée</h3>
    <div id="tocLeft"></div>
  </nav>

  <main id="main"></main>

  <nav class="toc-side toc-right" id="tocRightWrap" aria-label="Catégories de l'étage">
    <h3>Étage</h3>
    <div id="tocRight"></div>
  </nav>
</div>

<footer>Progression sauvegardée localement dans ce navigateur · Une étagère devient dorée quand toutes ses séries sont cochées</footer>

<button id="backToTop" aria-label="Remonter en haut de la page" title="Remonter en haut">▲</button>

const STORAGE_KEY = "librarian-progress-v1";
let state = {};
try{ state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }catch(e){ state = {}; }

const HIDE_PREF_KEY = "librarian-hide-completed-v1";
let hideCompleted = false;
try{ hideCompleted = JSON.parse(localStorage.getItem(HIDE_PREF_KEY)) || false; }catch(e){ hideCompleted = false; }

let floorFilter = "all";
let searchTerm = "";

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function saveHidePref(){
  localStorage.setItem(HIDE_PREF_KEY, JSON.stringify(hideCompleted));
}

function seriesKey(shelfCode, title){
  return shelfCode + "::" + title;
}

function totalSeriesCount(){
  return DATA.reduce((acc,s) => acc + s.series.length, 0);
}

function render(){
  const main = document.getElementById('main');
  main.innerHTML = "";

  const floors = [1,2];
  const floorNames = {1:"Rez-de-chaussée", 2:"Étage"};
  let anyVisible = false;

  floors.forEach(floorNum => {
    if(floorFilter !== "all" && String(floorFilter) !== String(floorNum)) return;

    const shelvesForFloor = DATA.filter(s => s.floor === floorNum);

    const heading = document.createElement('div');
    heading.className = 'floor-heading';
    heading.innerHTML = `<h2>${floorNames[floorNum]}</h2><div class="rule"></div>`;

    const grid = document.createElement('div');
    grid.className = 'shelf-grid';

    let floorHasVisible = false;

    shelvesForFloor.forEach(shelf => {
      const term = searchTerm.trim().toLowerCase();
      const matchingSeries = shelf.series
        .filter(([title]) => {
          if(!term) return true;
          return title.toLowerCase().includes(term) ||
                 shelf.theme.toLowerCase().includes(term) ||
                 shelf.code.toLowerCase().includes(term);
        })
        .slice()
        .sort((a, b) => a[0].localeCompare(b[0], 'fr', { sensitivity: 'base' }));

      if(term && matchingSeries.length === 0) return;

      const total = shelf.series.length;
      const doneCount = shelf.series.filter(([title]) => state[seriesKey(shelf.code,title)]).length;
      const isComplete = doneCount === total;

      const visibleRows = matchingSeries.filter(([title]) => {
        const isDone = !!state[seriesKey(shelf.code,title)];
        return !(hideCompleted && isDone);
      });

      if(visibleRows.length === 0 && !(term === "" && !hideCompleted)){
        if(hideCompleted && visibleRows.length === 0) {
          // shelf fully hidden when all remaining matching rows are done
        }
      }

      const shelfEl = document.createElement('div');
      shelfEl.id = 'shelf-' + shelf.code;
      shelfEl.className = 'shelf' + (isComplete ? ' complete' : '');
      if(hideCompleted && visibleRows.length === 0){
        shelfEl.classList.add('fully-hidden');
      } else {
        floorHasVisible = true;
        anyVisible = true;
      }

      const head = document.createElement('div');
      head.className = 'shelf-head';
      head.innerHTML = `
        <div class="shelf-head-left">
          <span class="shelf-code">${shelf.code}</span>
          <span class="shelf-theme">${shelf.theme}</span>
        </div>
        <span class="shelf-count">${doneCount}/${total}${isComplete ? ' ✦' : ''}</span>
      `;

      const progressBar = document.createElement('div');
      progressBar.className = 'shelf-progress';
      const progressFill = document.createElement('div');
      progressFill.className = 'shelf-progress-fill';
      progressFill.style.width = (total ? (doneCount/total*100) : 0) + '%';
      progressBar.appendChild(progressFill);

      const list = document.createElement('ul');
      list.className = 'shelf-list';

      matchingSeries.forEach(([title, volumes]) => {
        const key = seriesKey(shelf.code, title);
        const isDone = !!state[key];
        if(hideCompleted && isDone) return;

        const li = document.createElement('li');
        li.className = 'series-row' + (isDone ? ' done' : '');

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = isDone;
        cb.id = 'cb-' + key.replace(/[^a-zA-Z0-9]/g,'-');
        cb.addEventListener('change', () => {
          state[key] = cb.checked;
          saveState();
          render();
        });

        const textWrap = document.createElement('div');
        textWrap.className = 'series-text';
        const label = document.createElement('label');
        label.className = 'series-title';
        label.setAttribute('for', cb.id);
        label.textContent = title;
        textWrap.appendChild(label);

        const badge = document.createElement('span');
        badge.className = 'vol-badge';
        badge.textContent = volumes + 't';

        li.appendChild(cb);
        li.appendChild(textWrap);
        li.appendChild(badge);
        list.appendChild(li);
      });

      shelfEl.appendChild(head);
      shelfEl.appendChild(progressBar);
      shelfEl.appendChild(list);

      head.addEventListener('click', (e) => {
        if(e.target.tagName === 'INPUT') return;
        list.style.display = (list.style.display === 'none') ? '' : 'none';
        progressBar.style.display = (progressBar.style.display === 'none') ? '' : 'none';
      });

      grid.appendChild(shelfEl);
    });

    if(shelvesForFloor.some(s => {
      const term = searchTerm.trim().toLowerCase();
      const matches = s.series.filter(([title]) => !term || title.toLowerCase().includes(term) || s.theme.toLowerCase().includes(term) || s.code.toLowerCase().includes(term));
      return matches.length > 0;
    })){
      main.appendChild(heading);
      main.appendChild(grid);
    }
  });

  if(!anyVisible){
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = searchTerm ? "Aucune série ne correspond à votre recherche." : "Toutes les séries visibles sont terminées. Bibliothèque rangée !";
    main.appendChild(empty);
  }

  updateTally();
}

function updateTally(){
  const total = totalSeriesCount();
  let done = 0;
  DATA.forEach(shelf => shelf.series.forEach(([title]) => {
    if(state[seriesKey(shelf.code,title)]) done++;
  }));
  document.getElementById('tallyNum').firstChild.textContent = done;
  document.getElementById('progressFill').style.width = (done/total*100) + '%';
}

document.getElementById('hideToggle').addEventListener('click', function(){
  hideCompleted = !hideCompleted;
  this.classList.toggle('active', hideCompleted);
  this.textContent = hideCompleted ? "Afficher toutes les séries" : "Masquer les séries terminées";
  saveHidePref();
  render();
});

(function syncHideToggleButton(){
  const btn = document.getElementById('hideToggle');
  btn.classList.toggle('active', hideCompleted);
  btn.textContent = hideCompleted ? "Afficher toutes les séries" : "Masquer les séries terminées";
})();

document.querySelectorAll('.floor-btn').forEach(btn => {
  btn.addEventListener('click', function(){
    document.querySelectorAll('.floor-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    floorFilter = this.dataset.floor;
    render();
  });
});

const searchInputEl = document.getElementById('searchInput');
const searchClearBtn = document.getElementById('searchClear');

function updateSearchClearVisibility(){
  searchClearBtn.classList.toggle('visible', searchTerm.length > 0);
}

searchInputEl.addEventListener('input', function(){
  searchTerm = this.value;
  updateSearchClearVisibility();
  render();
});

searchClearBtn.addEventListener('click', function(){
  searchTerm = "";
  searchInputEl.value = "";
  updateSearchClearVisibility();
  searchInputEl.focus();
  render();
});

updateSearchClearVisibility();

document.getElementById('resetBtn').addEventListener('click', function(){
  if(confirm("Réinitialiser toute la progression ? Cette action est irréversible.")){
    state = {};
    saveState();
    render();
  }
});

function buildToc(){
  const left = document.getElementById('tocLeft');
  const right = document.getElementById('tocRight');
  left.innerHTML = "";
  right.innerHTML = "";

  DATA.forEach(shelf => {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'toc-item';
    item.innerHTML = `<span class="toc-code">${shelf.code}</span><span class="toc-theme">${shelf.theme}</span>`;
    item.addEventListener('click', () => goToShelf(shelf.code));
    (shelf.floor === 1 ? left : right).appendChild(item);
  });
}

function goToShelf(code){
  // Navigate directly to the shelf without applying any search/filter.
  searchTerm = "";
  document.getElementById('searchInput').value = "";
  updateSearchClearVisibility();
  floorFilter = "all";
  document.querySelectorAll('.floor-btn').forEach(b => b.classList.toggle('active', b.dataset.floor === 'all'));

  render();

  requestAnimationFrame(() => {
    const el = document.getElementById('shelf-' + code);
    if(el){
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 1150);
    }
  });
}

buildToc();
render();

function updateHeaderHeight(){
  const header = document.querySelector('header');
  if(header){
    document.documentElement.style.setProperty('--header-h', header.offsetHeight + 'px');
  }
}
updateHeaderHeight();
window.addEventListener('resize', updateHeaderHeight);
window.addEventListener('load', updateHeaderHeight);

const backToTopBtn = document.getElementById('backToTop');
function updateBackToTopVisibility(){
  backToTopBtn.classList.toggle('visible', window.scrollY > 400);
}
window.addEventListener('scroll', updateBackToTopVisibility, { passive: true });
updateBackToTopVisibility();
backToTopBtn.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
</script>
</body>
</html>
